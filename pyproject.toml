[project]
# PyPI distribution name — `basalt` is already taken by an unrelated package.
# Internal package name stays `basalt`; CLI command stays `basalt`.
name = "basalt-vault"
version = "0.0.1"
description = "Reads your vault and surfaces what you believe but never wrote down."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.17",
    "python-frontmatter>=1.1",
    "httpx>=0.28",
    "sqlite-vec>=0.1.6",
    "numpy>=2.0",
    "rich>=14",
]

[project.scripts]
basalt = "basalt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/basalt"]
