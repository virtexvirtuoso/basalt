<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <style>
      .bg { fill: #0E0D0C; }
      .panel { fill: #15130F; stroke: #2A2520; stroke-width: 1; }
      .accent { fill: #D9824B; }
      .accent-stroke { stroke: #D9824B; }
      .cream { fill: #EFE9E2; }
      .muted { fill: #8A8278; }
      .muted2 { fill: #6F6960; }
      .green { fill: #7FB069; }
      .mono { font-family: 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; }
      .pill { fill: none; stroke: #2A2520; stroke-width: 1; rx: 6; }
      .findcard { fill: #15130F; stroke: #2A2520; stroke-width: 1; }
      .findbar { fill: #D9824B; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="720"/>

  <!-- Center divider -->
  <line x1="800" y1="80" x2="800" y2="640" stroke="#1F1B17" stroke-width="1"/>

  <!-- ===== LEFT COLUMN ===== -->

  <!-- Logo: hexagon + BASALT wordmark -->
  <g transform="translate(80,80)">
    <polygon points="14,0 28,8 28,24 14,32 0,24 0,8" fill="none" stroke="#D9824B" stroke-width="1.5"/>
    <circle cx="14" cy="16" r="3" fill="#D9824B"/>
    <text x="50" y="22" class="cream sans" font-size="16" font-weight="500" letter-spacing="3">BASALT</text>
  </g>

  <!-- v0.0.1 · MIT badge -->
  <g transform="translate(580,72)">
    <rect class="pill accent-stroke" width="160" height="32" rx="2"/>
    <text x="80" y="22" class="accent mono" font-size="13" letter-spacing="2" text-anchor="middle">v0.0.1 · MIT</text>
  </g>

  <!-- Headline: Your vault / already knows. / Go ask it. -->
  <g class="cream" font-size="92" font-weight="400">
    <text x="80" y="240">Your vault</text>
    <text x="80" y="350" class="accent" font-style="italic">already knows<tspan class="cream" font-style="normal">.</tspan></text>
    <text x="80" y="460">Go ask it.</text>
  </g>

  <!-- Subtitle (italic serif) -->
  <g font-style="italic" font-size="22" fill="#B5ADA1">
    <text x="80" y="520">A weekly Brief compiled from your</text>
    <text x="80" y="552">Markdown notes — the thesis, the</text>
    <text x="80" y="584">contradiction, the drift, the connection.</text>
  </g>

  <!-- Property pills row 1 -->
  <g transform="translate(80,620)">
    <g>
      <rect class="pill" width="178" height="34" rx="6"/>
      <circle cx="16" cy="17" r="3" fill="#D9824B"/>
      <text x="28" y="22" class="muted sans" font-size="12" letter-spacing="2">100% LOCAL</text>
    </g>
    <g transform="translate(192,0)">
      <rect class="pill" width="200" height="34" rx="6"/>
      <circle cx="16" cy="17" r="3" fill="#D9824B"/>
      <text x="28" y="22" class="muted sans" font-size="12" letter-spacing="2">ZERO TELEMETRY</text>
    </g>
    <g transform="translate(406,0)">
      <rect class="pill" width="220" height="34" rx="6"/>
      <circle cx="16" cy="17" r="3" fill="#D9824B"/>
      <text x="28" y="22" class="muted sans" font-size="12" letter-spacing="2">OPEN-SOURCE · MIT</text>
    </g>
  </g>

  <!-- Property pills row 2 -->
  <g transform="translate(80,664)">
    <g>
      <rect class="pill" width="278" height="34" rx="6"/>
      <circle cx="16" cy="17" r="3" fill="#D9824B"/>
      <text x="28" y="22" class="muted sans" font-size="12" letter-spacing="2">READS MARKDOWN IN PLACE</text>
    </g>
  </g>

  <!-- ===== RIGHT COLUMN: Terminal mockup ===== -->
  <g transform="translate(870,140)">
    <!-- Terminal panel -->
    <rect class="panel" width="660" height="440" rx="8"/>

    <!-- Header bar -->
    <g>
      <circle cx="20" cy="22" r="4" fill="#D9824B"/>
      <text x="34" y="27" class="muted sans" font-size="11" letter-spacing="2">BASALT BRIEF — SAMPLE VAULT</text>
      <text x="640" y="27" class="muted mono" font-size="11" text-anchor="end">5.4S</text>
      <line x1="0" y1="44" x2="660" y2="44" stroke="#1F1B17" stroke-width="1"/>
    </g>

    <!-- Command line -->
    <g class="mono" font-size="15" transform="translate(28,80)">
      <text class="accent" font-weight="700">$ <tspan class="cream">basalt brief</tspan></text>
    </g>

    <!-- Stats line -->
    <text x="28" y="116" class="muted mono" font-size="13">embedding · 1,683 notes · local</text>

    <!-- Result lines -->
    <g class="mono" font-size="14" transform="translate(28,156)">
      <g>
        <text class="green">✓</text>
        <text x="20" class="cream">Thesis · 7 notes · 14 weeks</text>
      </g>
      <g transform="translate(0,28)">
        <text class="green">✓</text>
        <text x="20" class="cream">Contradiction · 2 notes · 2d apart</text>
      </g>
      <g transform="translate(0,56)">
        <text class="green">✓</text>
        <text x="20" class="cream">Drift · stated 4 → lived 11%</text>
      </g>
      <g transform="translate(0,84)">
        <text class="green">✓</text>
        <text x="20" class="cream">Connection · Reading ↔ Project</text>
      </g>
    </g>

    <!-- Finding card 1 -->
    <g transform="translate(28,290)">
      <rect class="findcard" width="600" height="56" rx="3"/>
      <rect class="findbar" width="2" height="56"/>
      <text x="16" y="22" class="muted sans" font-size="11" letter-spacing="2">01 · THE THESIS</text>
      <text x="16" y="44" class="cream" font-style="italic" font-size="14">The work that compounds is the work nobody asked for.</text>
    </g>

    <!-- Finding card 2 -->
    <g transform="translate(28,360)">
      <rect class="findcard" width="600" height="56" rx="3"/>
      <rect class="findbar" width="2" height="56"/>
      <text x="16" y="22" class="muted sans" font-size="11" letter-spacing="2">04 · THE CONNECTION</text>
      <text x="16" y="44" class="cream" font-style="italic" font-size="14">A reading note from December solves Atlas/AUDIT.md.</text>
    </g>
  </g>
</svg>
